plugins {
    id 'java'
    id 'net.serenity-bdd.serenity-gradle-plugin' version '4.2.32'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

// Todas las dependencias de Serenity deben usar la misma versión
def serenityVersion = '4.2.32'

dependencies {
    implementation "net.serenity-bdd:serenity-core:${serenityVersion}"
    implementation "net.serenity-bdd:serenity-cucumber:${serenityVersion}"
    implementation "net.serenity-bdd:serenity-screenplay:${serenityVersion}"
    implementation "net.serenity-bdd:serenity-screenplay-webdriver:${serenityVersion}"

    testImplementation "net.serenity-bdd:serenity-junit:${serenityVersion}"
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.hamcrest:hamcrest:2.2'

    // Runner JUnit 4 (CucumberWithSerenity) ejecutado sobre JUnit Platform
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

test {
    useJUnitPlatform()
    maxHeapSize = "384m"
    jvmArgs "-XX:+UseSerialGC"
    test.finalizedBy(aggregate)
    // Pasar propiedades del sistema a los tests (ej: -Dcucumber.filter.tags="@Issue-1")
    systemProperties = System.properties
}
