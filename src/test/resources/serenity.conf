serenity.project.name = "PetStay - Hotel para Mascotas"
serenity.test.root = features
serenity.requirements.dir = features
serenity.requirements.base.dir = src/test/resources
serenity.outputDirectory = target/site/serenity
serenity.report.encoding = UTF8
serenity.take.screenshots = FOR_EACH_ACTION
serenity.restart.browser.for.each = scenario
webdriver.timeouts.implicitlywait = 15000

# Navegador por defecto: Chrome headless (requerido para GitHub Actions).
# Para otro navegador: -Denvironment=edge | -Denvironment=firefox | -Denvironment=visible (Chrome con ventana)
webdriver {
  driver = chrome
  autodownload = true
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    "goog:chromeOptions" {
      args = ["--headless=new", "--window-size=1366,900", "--no-sandbox", "--disable-dev-shm-usage", "--disable-popup-blocking", "--disable-infobars", "--disable-notifications", "--remote-allow-origins=*", "--ignore-certificate-errors", "--disable-gpu", "--disable-extensions", "--renderer-process-limit=2"]
    }
  }
}

environments {
  # Para la demostración en vivo: Chrome con ventana visible (-Denvironment=visible)
  visible {
    webdriver {
      driver = chrome
      autodownload = true
      capabilities {
        browserName = "chrome"
        acceptInsecureCerts = true
        "goog:chromeOptions" {
          args = ["--window-size=1366,900", "--disable-notifications", "--disable-infobars", "--remote-allow-origins=*", "--ignore-certificate-errors"]
        }
      }
    }
  }
  edge {
    webdriver {
    driver = "edge"
    autodownload = true
      capabilities {
        browserName = "MicrosoftEdge"
        "ms:edgeOptions" {
          args = ["test-type", "ignore-certificate-errors", "headless",
            "incognito", "disable-infobars", "disable-gpu", "disable-default-apps", "disable-popup-blocking"]
        }
      }
    }
  }
  firefox {
    webdriver {
      driver = "firefox"
      autodownload = true
      capabilities {
        browserName = "firefox"
        pageLoadStrategy = "normal"
        acceptInsecureCerts = true
        unhandledPromptBehavior = "dismiss"
        strictFileInteractability = true

        "moz:firefoxOptions" {
          args = ["-headless"]
          prefs {
            "javascript.options.showInConsole": false
          },
          log {"level": "info"}
        }
      }
    }
  }
}
